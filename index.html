<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jogo de tabuleiro educativo para melhorar o inglês com perguntas, status e loja interativa.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>English Game | Tabuleiro Educativo</title>
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">Jogo Educativo</p>
        <h1>Tabuleiro de Inglês</h1>
      </div>
      <button id="shop-open-btn" type="button" class="shop-toggle" aria-label="Abrir loja">Abrir Loja</button>
    </header>

    <section class="legend" aria-label="Legenda de casas especiais">
      <div class="cardEvento cell-quiz">Quiz</div>
      <div class="cardEvento cell-luck">Avança</div>
      <div class="cardEvento cell-badluck">Volta</div>
      <div class="cardEvento cell-vida">Vida</div>
      <div class="cardEvento ajuda-pular">Pular</div>
      <div class="cardEvento ajuda-eliminar">Eliminar</div>
      <div class="cardEvento cell-perde-vida">Perde Vida</div>
      <div class="cardEvento cell-perde-ajuda">Perde Ajuda</div>
      <div class="cardEvento cell-perde-todas">Perde Todas</div>
      <div class="cardEvento cell-peso-up">Aumenta Peso</div>
      <div class="cardEvento cell-peso-down">Diminui Peso</div>
      <div class="cardEvento loja">Loja</div>
    </section>

    <section class="controls" aria-label="Painel de controle do jogo">
      <div class="status-items" aria-live="polite" aria-atomic="true">
        <div class="status-item"><span class="status-label">Pontos</span><strong id="ui-pontos">0</strong></div>
        <div class="status-item"><span class="status-label">Vidas</span><strong id="ui-vidas">3</strong></div>
        <div class="status-item"><span class="status-label">Ajudas Pular</span><strong id="ui-pular">0</strong></div>
        <div class="status-item"><span class="status-label">Ajudas Eliminar</span><strong id="ui-eliminar">0</strong></div>
        <div class="status-item"><span class="status-label">Peso</span><strong id="ui-peso">x1.0</strong></div>
      </div>
      <div class="action-row">
        <p id="status" class="status-text" aria-live="polite">Clique no dado para começar!</p>
        <div class="button-group">
          <button id="dice-btn" type="button">Jogar Dado</button>
          <button id="shop-open-btn-2" type="button">Loja</button>
        </div>
      </div>
    </section>

    <main id="main-content" class="game-area">
      <div id="game-container" aria-label="Tabuleiro do jogo">
        <div id="board" role="grid" aria-label="Tabuleiro de 60 casas"></div>
        <div id="player" aria-hidden="true"></div>
      </div>
    </main>

    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
      <div class="modal-box">
        <h3 id="modal-title">Pergunta</h3>
        <p id="modal-msg"></p>
        <div id="modal-opts" class="options-grid"></div>
        <div id="modal-help" class="modal-help"></div>
      </div>
    </div>

    <div id="loja-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="loja-title" hidden>
      <div class="modal loja-modal">
        <h2 id="loja-title">Loja</h2>
        <div id="loja-pontos" class="loja-pontos"></div>
        <div class="loja-itens">
          <button type="button" onclick="comprarItem('vida')">
            <span>Vida extra</span>
            <span>50 pts</span>
          </button>
          <button type="button" onclick="comprarItem('eliminar')">
            <span>Eliminar alternativas (x2)</span>
            <span>30 pts</span>
          </button>
          <button type="button" onclick="comprarItem('pular')">
            <span>Pular pergunta</span>
            <span>30 pts</span>
          </button>
          <button type="button" onclick="comprarItem('peso')">
            <span>Aumentar peso</span>
            <span>70 pts</span>
          </button>
        </div>
        <button type="button" class="btn-fechar" onclick="fecharLoja()">Fechar Loja</button>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
